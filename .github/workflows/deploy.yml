name: Deploy

# Builds the Astro site with the @astrojs/cloudflare adapter and deploys it as a Cloudflare Worker.
# Branch → environment (routes are declared in wrangler.jsonc):
#   master → `flick-tt-web`          (production, www.flicktt.com)
#   dev    → `flick-tt-web-preview`  (preview, preview.flicktt.club)
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token with "Workers Scripts: Edit" + "Workers Routes: Edit" for BOTH zones
#                           (flicktt.com and flicktt.club)
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
on:
  push:
    branches: [ master, dev ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9   # pinned to the major that produced pnpm-lock.yaml (lockfileVersion 9.0)

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          CLOUDFLARE_ENV: ${{ github.ref_name == 'dev' && 'preview' || '' }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
